services:
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: multiformat-rag-opensearch
    environment:
      - cluster.name=multiformat-rag-cluster
      - node.name=multiformat-rag-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    restart: unless-stopped
    networks:
      - rag-net

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    container_name: multiformat-rag-dashboards
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://multiformat-rag-opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - rag-net
    depends_on:
      - opensearch
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: multiformat-rag-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - rag-net

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: multiformat-rag-redis-commander
    environment:
      - REDIS_HOSTS=local:multiformat-rag-redis:6379
    ports:
      - "8081:8081"
    networks:
      - rag-net
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  opensearch-data:
    name: multiformat-rag-opensearch-data
  redis-data:
    name: multiformat-rag-redis-data

networks:
  rag-net:
    name: multiformat-rag-network
