version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: multiformat-rag-opensearch
    environment:
      - cluster.name=multiformat-rag-cluster
      - node.name=multiformat-rag-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    restart: unless-stopped

volumes:
  opensearch-data:
    name: multiformat-rag-opensearch-data
